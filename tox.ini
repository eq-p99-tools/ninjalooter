[tox]
envlist = lint,coverage

[testenv]
basepython = python3
setenv = PYTHONDONTWRITEBYTECODE=1
usedevelop = True
extras = test

[testenv:lint]
commands =
    ruff format ninjalooter/
    ruff check ninjalooter/ {posargs}

[testenv:py3]
; changedir = {envtmpdir}
commands = python -m unittest discover -v -s ninjalooter.tests

[testenv:coverage]
; changedir = {envtmpdir}
commands =
    coverage erase
    coverage run -m unittest discover -v -s ninjalooter.tests
    coverage report -m --fail-under 60
    coverage html

[testenv:build]
deps = pyinstaller
commands =
    python build_bootloader.py
    pyinstaller ninjalooter_py.spec